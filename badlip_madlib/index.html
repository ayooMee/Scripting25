<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadLip MadLib</title>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-------My CSS------->
    <link rel="stylesheet" href="css/simple.css">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <h1 class="sidebar-title">BadLip MadLib</h1>
                <p class="sidebar-text">
                    Creator! Good news and Bad news boss. Our last client liked your artistic vision, but had issues with certain word choices. So, insert the keywords needed and re-ship your creation to the client. Thank you, Creator.
                </p>
                

                <div class="action-buttons">
                    <button type="button" id="reset-button" class="retro-btn retro-btn-reset w-100 mb-2">
                        RESET
                    </button>
                    <button type="submit" form="madlip-form" class="retro-btn w-100 mb-3">
                        RE-SHIP
                    </button>
                </div>
                
                
                <!-- Status Image -->
                <img id="story-image" src="assetsdem/scrib_blank.png" alt="Status" class="story-image">
            </div>

            <!-- Main Content -->
            <div class="col-md-9 main-content">
                
                <form id="madlip-form" onsubmit="geneStory(event)">
                    
                    <!-- Input Grid -->
                    <div class="input-grid">
                        <div class="input-card">
                            <label for="adjective_1" class="input-label">ADJECTIVE</label>
                            <input type="text" id="adjective_1" name="adjective_1" class="form-control" placeholder="deep" required>
                        </div>

                        <div class="input-card">
                            <label for="liquid_1" class="input-label">PLACE</label>
                            <input type="text" id="liquid_1" class="form-control" placeholder="corner store" required>
                        </div>

                        <div class="input-card">
                            <label for="number_1" class="input-label">BIGGER PLACE</label>
                            <input type="text" id="number_1" name="number_1" class="form-control" placeholder="skyscraper" required>
                        </div>

                        <div class="input-card">
                            <label for="noun_plural_1" class="input-label">DRAMATIC VERB (PRESENT)</label>
                            <input type="text" id="noun_plural_1" name="noun_plural_1" class="form-control" placeholder="burns" required>
                        </div>

                        <div class="input-card">
                            <label for="adverb_1" class="input-label">ADVERB (Frequency)</label>
                            <input type="text" id="adverb_1" name="adverb_1" class="form-control" placeholder="constantly" required>
                        </div>

                        <div class="input-card">
                            <label for="verb_ing_1" class="input-label">NEGATIVE ADJECTIVE</label>
                            <input type="text" id="verb_ing_1" name="verb_ing_1" class="form-control" placeholder="toxic" required>
                        </div>

                        <div class="input-card">
                            <label for="terrifying_sound_1" class="input-label">GOOD PLACE</label>
                            <input type="text" id="terrifying_sound_1" name="terrifying_sound_1" class="form-control" placeholder="outer space" required>
                        </div>

                        <div class="input-card">
                            <label for="body_part_plural_1" class="input-label">NOUN (PLURAL)</label>
                            <input type="text" id="body_part_plural_1" name="body_part_plural_1" class="form-control" placeholder="haters" required>
                        </div>

                        <div class="input-card">
                            <label for="plural_creature_1" class="input-label">NOUN (PLURAL) #2</label>
                            <input type="text" id="plural_creature_1" name="plural_creature_1" class="form-control" placeholder="cards" required>
                        </div>

                        <div class="input-card">
                            <label for="adjective_scale_1" class="input-label">FORMAL ATTIRE</label>
                            <input type="text" id="adjective_scale_1" name="adjective_scale_1" class="form-control" placeholder="suit" required>
                        </div>

                        <div class="input-card">
                            <label for="noun_singular_1" class="input-label">CARD GAME</label>
                            <input type="text" id="noun_singular_1" name="noun_singular_1" class="form-control" placeholder="poker" required>
                        </div>

                        <div class="input-card">
                            <label for="verb_past_1" class="input-label">ADJECTIVE #2</label>
                            <input type="text" id="verb_past_1" name="verb_past_1" class="form-control" placeholder="lifeless" required>
                        </div>

                        <div class="input-card">
                            <label for="exclamation_1" class="input-label">SURFACE</label>
                            <input type="text" id="exclamation_1" name="exclamation_1" class="form-control" placeholder="concrete" required>
                        </div>
                    </div>
                </form>

                <div class="radio-section">
    <h3 class="radio-title">COLOR MODE</h3>
    <div class="radio-group">
        <label class="radio-label">
            <input type="radio" name="color_mode" value="normal" checked onchange="toggleColorMode()">
            <span class="radio-text">NORMAL</span>
        </label>
        <label class="radio-label">
            <input type="radio" name="color_mode" value="inverted" onchange="toggleColorMode()">
            <span class="radio-text">INVERTED</span>
        </label>
    </div>
</div>

                <!-- Story Output -->
                <div class="output-section">
                    <h2 class="output-title">STORY OUTPUT</h2>
                    <div id="story-output" class="story-display">
                        <p>Your Creation Is Waiting..</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    

    <script src="java/java.js"></script>
</body>

</html>
